<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Web Clon - Paradigmas</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #dadbd4; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        #chat-container { width: 100%; max-width: 450px; height: 90vh; background-color: #efeae2; display: flex; flex-direction: column; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); overflow: hidden; }
        
        header { background-color: #075e54; color: white; padding: 15px; display: flex; align-items: center; font-size: 18px; font-weight: bold; }
        
        #pantalla-mensajes { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        
        .burbuja { padding: 8px 12px; border-radius: 8px; max-width: 75%; width: fit-content; box-shadow: 0 1px 2px rgba(0,0,0,0.1); font-size: 15px; line-height: 1.4; word-wrap: break-word; }
        .burbuja strong { color: #35a086; display: block; font-size: 12px; margin-bottom: 2px; }
.burbuja { padding: 8px 12px; border-radius: 8px; max-width: 75%; width: fit-content; box-shadow: 0 1px 2px rgba(0,0,0,0.1); font-size: 15px; line-height: 1.4; word-wrap: break-word; }
.burbuja strong { color: #35a086; display: block; font-size: 12px; margin-bottom: 2px; }

.recibido { background-color: white; align-self: flex-start; border-top-left-radius: 0; }

.enviado { background-color: #d9fdd3; align-self: flex-end; border-top-right-radius: 0; }
.enviado strong { display: none; }
        
        footer { background-color: #f0f2f5; padding: 10px; display: flex; align-items: center; gap: 10px; }
        #input-mensaje { flex: 1; padding: 10px 15px; border: none; border-radius: 20px; font-size: 15px; outline: none; background-color: white; }
        
        button { background-color: #00a884; color: white; border: none; padding: 10px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 14px; transition: background 0.2s; }
        button:hover { background-color: #008f72; }
    </style>
</head>
<body>

    <div id="chat-container">
        <header>💬 Sala de Chat - Sockets</header>
        
        <div id="pantalla-mensajes">
            </div>
        
        <footer>
            <input type="text" id="input-mensaje" placeholder="Escribe un mensaje aquí..." autocomplete="off">
            <button id="btn-enviar">Enviar</button>
        </footer>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="scripts/app.js"></script>
</body>
</html>
